[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp"
version = "0.1.0"
description = "Radar data pipeline: ingest, DSP, data quality, ML anomaly detection and versioned training data on real 77 GHz FMCW radar measurements"
authors = [{ name = "Pavan Yadav Annappa" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "h5py>=3.10", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4",
  "matplotlib>=3.8", "pyyaml>=6", "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
rdp = "rdp.cli:main"

[tool.setuptools]
packages = ["rdp"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
